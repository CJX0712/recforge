[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recforge"
version = "0.1.0"
description = "RecForge · 世界顶级推荐系统（ALS 协同过滤，SOTA 对标 + 离线兜底）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "implicit",
    "optuna",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402", "BLE001", "F841", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W ignore::UserWarning"
